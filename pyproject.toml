# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-mermaid"
version = "0.0.1"
description = "Introspect the whole NetBox source-of-truth and render it as one readable Mermaid diagram (UI + REST), with a public-safe sanitize mode"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Jameson" }]
keywords = ["netbox", "netbox-plugin", "mermaid", "visualization", "diagram", "sot"]
# PEP 639: the SPDX `license` expression above is authoritative; a `License ::`
# classifier alongside it is rejected by setuptools>=77, so it is intentionally omitted.
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
# NO hard dependencies: every in-house plugin is an OPTIONAL source, guarded at collect time by
# apps.is_installed(). The plugin runs and renders the core-only diagram with none of them present.
dependencies = []

[project.optional-dependencies]
# Install the whole in-house SoT surface so every collector has data to introspect.
all = [
    "netbox-services",
    "netbox-database",
    "netbox-wordpress",
    "netbox-webserver",
    "netbox-pki",
    "netbox-email",
    "netbox-federation",
]

[project.urls]
Repository = "https://github.com/JamesonRGrieve/netbox-mermaid"

[tool.setuptools.packages.find]
include = ["netbox_mermaid*"]

[tool.setuptools.package-data]
# The UI template + the vendored mermaid.js + the CSP-safe init script must ship in the wheel
# (deploy is via non-editable wheels — memory: "NetBox plugin deploy = wheels").
netbox_mermaid = ["templates/**/*.html", "static/**/*.js"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netbox.settings"
python_files = ["test_*.py"]
addopts = "-v"
